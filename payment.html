<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLoop | Paiement</title>
    <meta name="description" content="Confirmation de paiement FoodLoop avec choix de methode, carte bancaire ou paiement sur place.">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="payment-body">
    <main id="paymentApp" class="payment-page">
        <section class="payment-shell">
            <div class="payment-card">
                <div class="payment-header">
                    <p class="payment-kicker">Confirmation de paiement</p>
                    <h1 id="paymentTitle">Choisissez votre mode de paiement</h1>
                    <p id="paymentSubtitle" class="payment-subtitle">
                        Finalisez votre reservation en quelques secondes.
                    </p>
                </div>
                <div id="paymentContent" class="payment-content"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
