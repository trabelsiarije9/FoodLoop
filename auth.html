<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLoop | Authentification</title>
    <meta name="description" content="Parcours de connexion et inscription FoodLoop avec etapes animees et formulaire dynamique.">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <main class="auth-flow-page">
        <section id="authApp" class="auth-flow-shell">
            <div class="auth-flow-card">
                <div class="auth-flow-header">
                    <p class="auth-flow-kicker">FoodLoop</p>
                    <h1 id="authTitle">Se connecter</h1>
                    <p id="authSubtitle" class="auth-flow-subtitle">
                        Connectez-vous ou creez un compte en quelques etapes.
                    </p>
                </div>

                <div id="authStepIndicator" class="auth-step-indicator" aria-label="Progression"></div>

                <div class="auth-flow-stage">
                    <div id="authStepContent" class="auth-step-content"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
